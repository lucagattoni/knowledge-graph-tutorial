name: docs

# Build the MkDocs site on every PR (--strict, so a broken internal link or anchor fails the check),
# and deploy it to GitHub Pages on push to main.
#
# Path-filtered on purpose: the site is a view over the Markdown in docs/ (the documentation) and
# DECISIONS.md, kb-kg/ and pinakes/ (the archive), so a change to RESUME.md or the root README.md
# cannot break it. tools/build_docs.py writes the generated sections of docs/, so it and its tests
# are in the filter. docs-site/ holds the staging script and the hook that decides how anchors are
# slugged and links are rewritten, which is what --strict validates.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - DECISIONS.md
      - kb-kg/**
      - pinakes/**
      - tools/build_docs.py
      - tools/test_build_docs.py
      - mkdocs.yml
      - docs-site/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - DECISIONS.md
      - kb-kg/**
      - pinakes/**
      - tools/build_docs.py
      - tools/test_build_docs.py
      - mkdocs.yml
      - docs-site/**
      - .github/workflows/docs.yml

permissions:
  contents: read

# One deploy at a time. `cancel-in-progress: false` so a queued deploy finishes rather than being
# dropped: a cancelled Pages deploy leaves the site on the previous commit with no failure shown.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: docs-site/requirements.txt
      - run: uv run python -m unittest discover -s docs-site
      # The generated sections of docs/ (A-Z index, watch list, changes, appears-in) must be up to
      # date: --check exits 0 when they are, 1 when stale and 2 on invalid input.
      - run: uv run python -m unittest tools/test_build_docs.py
      - run: uv run tools/build_docs.py --check
      - run: uv run docs-site/stage_docs.py
      # uv provisions Python + an ephemeral env from requirements.txt, then builds. mkdocs is not a
      # project dependency: this repository has no Python project to install it into.
      - run: uv run --no-project --with-requirements docs-site/requirements.txt mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only publish from main, never from a PR.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
